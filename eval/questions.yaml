# Eval questions. Each expected paper was checked to be in the corpus with an abstract embedding
# (state ready = full text, or signals_done = abstract level) and its title verified against the id.
# Papers only known from reference lookups (state 'discovered', no embedding) were left out on purpose.
#
# Fields:
#   mode      quick | deep (deep fetches full text for the top papers)
#   landmark  an expected paper is a landmark or foundational paper (the anchor channel always considers those)
#   named     the question contains the paper's method/model name, a distinctive phrase from its title, or the
#             named conjecture it resolves; unnamed questions describe the idea only
#   field     cs | math
questions:
  # --- architecture and scaling
  - {id: 1, mode: quick, topic: architecture, field: cs, landmark: true, named: true, question: "How does the Transformer replace recurrence with self-attention?", expected_papers: ["1706.03762"]}
