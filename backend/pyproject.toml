[project]
name = "arxiv-research-engine"
version = "0.1.0"
description = "Local research engine over arXiv CS + math papers with passage-level citations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "google-genai>=1.50",
    "orjson>=3.10",
    "numpy>=1.26",
    "pgvector>=0.3",
    "kaggle>=1.7",
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["arq.*", "asyncpg.*", "sentence_transformers.*", "kaggle.*", "pymupdf.*", "fitz.*", "scipy.*"]
ignore_missing_imports = true
