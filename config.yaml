corpus:
  years_back: 5                      # by v1 submission date
  categories_prefixes: ["cs.", "math."]
  landmarks_file: seeds/landmark_papers.yaml
  foundational_min_fulltext_citations: 20   # older papers cited by this many full-text papers join tier 1
  stub_min_corpus_citations: 3
  warm_default_top_n: 30             # papers fetched by `make warm`
score_weights:                       # metadata score, used as the retrieval prior and to rank fetch candidates
  venue_accepted: 0.55
  code_available: 0.25
  recency: 0.20
venue_patterns:                      # matched case-insensitively in journal-ref and comments
  - NeurIPS|NIPS|ICML|ICLR|COLT|AISTATS|UAI|AAAI|IJCAI|KDD|WWW|SIGIR|WSDM
  - CVPR|ICCV|ECCV|ACL|EMNLP|NAACL|COLING|TACL|TMLR|JMLR
  - OSDI|SOSP|NSDI|EuroSys|ATC|MLSys|ASPLOS|ISCA|MICRO|SIGMOD|VLDB|ICDE|PODC|SPAA|PLDI|POPL|SIGCOMM
  - STOC|FOCS|SODA|ICALP|CCC|ITCS
  - Annals of Mathematics|Inventiones|Journal of the AMS|J\. Amer\. Math\. Soc|Acta Mathematica|Duke Math|Publ\. Math\. IHES|Geometry & Topology|Forum of Mathematics
venue_context_words: "accepted|to appear|published|camera[- ]ready|proceedings|in press"
chunking:
  target_tokens: 350
  max_tokens: 450
  overlap_tokens: 50
  min_tokens: 50
models:
  embedding: BAAI/bge-small-en-v1.5   # 384 dims
  embedding_query_prefix: "Represent this sentence for searching relevant passages: "
  reranker: BAAI/bge-reranker-v2-m3   # chosen over bge-reranker-base in an A/B test
  llm_main: gemini-3.5-flash
  llm_light: gemini-3.5-flash-lite
  write_model: gemini-3.5-flash-lite # WRITE; gemini-3.5-flash is the other option
  write_thinking_level: minimal      # WRITE only; other calls use "low". flash accepts minimal|low|medium|high
retrieval:
  paper_keyword_k: 100               # per query, over title + abstract
  paper_vector_k: 100
  keyword_drop_generic: true         # drop generic question words before the AND keyword query
  keyword_gate_k: 200                # keyword hits must be in the vector channel's top N for the query (0 = off)
  rerank_top_n: 50                   # merged candidates sent to the reranker
  chunk_keyword_k: 50                # within the selected papers only
  chunk_vector_k: 50
  rrf_k: 60
  rerank_min_score: 0.05             # papers below are dropped (an answer may use fewer than papers_for_answer); tune with eval
  min_papers_kept: 3                 # ...but the top 3 are always kept
  name_match_boost: 0.1              # title part before a colon ("QLoRA: ...") named in the question or queries
  anchor_k: 5                        # top landmark/foundational papers that always join the rerank candidates
  hnsw_ef_search: 100
  prior_boost_max: 0.05              # composite-score boost after rerank, capped
agent:
  max_queries: 3                     # search queries generated from the question
  papers_for_answer: 12              # top N papers used for the answer (10 to 15)
  passages_for_answer: 25
  max_passages_per_paper: 3
  fetch_wait_s: 90                   # deep mode: max wait for full-text fetches
  deep_max_fetch: 8                  # deep mode: only the top N selected papers get full text; the rest use abstracts
  quick_timeout_s: 45
  deep_timeout_s: 180
  resume_grace_s: 60                 # a run resumed after a worker restart gets at least this much time left
  max_notes: 50
  verify_batch_size: 5
  consensus_claims: 3
  chain_from_top_papers: 5            # deep mode: follow references of these papers
  chain_max_added: 3
  thread_full_turns: 3               # turns passed verbatim, older ones summarized
  thread_carryover_boost: 0.05
llm_client:
  max_concurrency: 4
  retries: 5
  fallback_after_503_retries: 2      # after this many 503 retries on llm_main, finish the call on llm_light
  rpm_limits:                        # proactive requests-per-minute caps, shared by all processes (free tier)
    gemini-3.5-flash-lite: 14        # free tier: 15/min
    gemini-3.5-flash: 9              # conservative; its binding free-tier limit is 20 requests/day
  daily_caps:                        # hard stop per Pacific-time day, counted by every process (app and eval scripts)
    gemini-3.5-flash-lite: 450       # free tier: 500/day
  backoff_base_s: 1
  backoff_max_s: 30
  cache_ttl_days: 30                 # long enough that eval reruns (make eval ARGS=--answers) come from the cache
arxiv:
  min_interval_s: 3.1
  user_agent: "arxiv-research-engine/0.1 (mailto:${CONTACT_EMAIL})"
jobs:
  oai_harvest_enabled: false         # nightly OAI-PMH harvest. Off: arXiv's OAI ListRecords returns HTTP 406.
                                     # New papers come from the weekly Kaggle snapshot job instead (Mondays 00:30 UTC).
feeds:                               # weekly digests
  digest_days: 7                     # papers submitted in the last N days
  top_n: 10
  min_score: 0.3                     # cross-encoder relevance (0-1) + keyword boost; bge-small similarity alone could not separate on-topic papers
  keyword_boost: 0.05                # added when a feed keyword appears in title or abstract
llm_prices:                          # USD per 1M tokens (output includes thinking tokens). null = unknown, cost is logged as null.
  gemini-3.5-flash: {input: 1.50, output: 9.00}
  gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
